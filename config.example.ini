[fireflies]
# Your Fireflies.ai API key
api_key = YOUR_FIREFLIES_API_KEY_HERE

# Base URL for Fireflies API
api_base_url = https://api.fireflies.ai/graphql

[google_drive]
# Path to Google Drive credentials JSON file
credentials_file = credentials.json

# Google Drive folder ID where transcripts will be saved
destination_folder_id = YOUR_FOLDER_ID_HERE

[download]
# Number of transcripts to download per batch
batch_size = 10

# Download transcripts from the last N days (0 = all)
days_back = 30

# Output format (txt, pdf, json)
format = txt
