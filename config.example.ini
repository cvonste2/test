[fireflies]
# Your Fireflies.ai API key
# Get it from: https://app.fireflies.ai/integrations/custom/fireflies
api_key = YOUR_FIREFLIES_API_KEY_HERE

# Base URL for Fireflies API (don't change unless using custom endpoint)
api_base_url = https://api.fireflies.ai/graphql

[google_drive]
# Path to Google Drive credentials JSON file downloaded from Google Cloud Console
credentials_file = credentials.json

# Google Drive root folder name where transcripts will be saved
# The app will create year-based subfolders automatically (e.g., 2025/, 2024/)
destination_folder_name = Fireflies Transcripts

# Token storage file (created automatically after first authentication)
token_file = token.json

[download]
# Maximum number of participants to include in filename (default: 5)
max_participants_in_filename = 5

# Maximum filename length before truncation (default: 200, max: 255)
max_filename_length = 200

# Local metadata file to track downloaded transcripts
metadata_file = .fireflies_metadata.json

[logging]
# Log level: DEBUG, INFO, WARNING, ERROR
log_level = INFO

# Log file location (leave empty to log to console only)
log_file =
